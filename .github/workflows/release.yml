name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    # Tests and builds run without write access; only the publish job can write.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check tag matches source version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from falsicore import __version__
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'v'+__version__:
              raise SystemExit('Refusing release: tag and source version mismatch')
          PY
      - name: Require a verified annotated release tag for exactly this source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(printf '%s' "$tag_ref" | jq -er '.object.type')" = tag
          tag_sha="$(printf '%s' "$tag_ref" | jq -er '.object.sha')"
          tag_info="$(gh api "repos/$GH_REPO/git/tags/$tag_sha")"
          printf '%s' "$tag_info" | jq -e '.verification.verified == true and .object.type == "commit"'
          test "$(printf '%s' "$tag_info" | jq -er '.tag')" = "$GITHUB_REF_NAME"
          test "$(printf '%s' "$tag_info" | jq -er '.object.sha')" = "$(git rev-parse HEAD)"
          # No stale or unmerged source may be published under the active
          # source version: tag and protected main must designate one commit.
          main_sha="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$(git rev-parse HEAD)"
      - name: Install required property and static analysis tools
        run: python -m pip install --disable-pip-version-check hypothesis==6.135.26 ruff==0.15.22 bandit==1.8.6 mypy==1.18.2
      - name: Test and audit
        env:
          FALSICORE_REQUIRE_HYPOTHESIS: "1"
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_MANIFEST.sha256
          python tools/build_release.py --check-manifest
          ( cd docs/verification/source && sha256sum -c AUDIT_CHECKSUMS.txt )
          python assurance/check_registry.py
          python -m unittest discover -s assurance -q
          python -m unittest discover -s tests -q
          python tools/code_audit.py . --fail-on high
          python -m tools.evaluate_rules
          python tools/validity.py --check
          python -m ruff check --select F,E9,B,PLE falsicore tools falsicore.py
          python -m bandit -q -r falsicore tools falsicore.py -c pyproject.toml
          python -m mypy
      - name: Verify fresh source-bound release receipt
        run: |
          python tools/release_receipt.py --output "$RUNNER_TEMP/RELEASE_RECEIPT.json"
          python tools/release_receipt.py --check --output "$RUNNER_TEMP/RELEASE_RECEIPT.json"
      - name: Deterministic builds (twice) with external checksums
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          python tools/build_app.py "$RUNNER_TEMP/a.pyz"
          python tools/build_app.py "$RUNNER_TEMP/b.pyz"
          cmp "$RUNNER_TEMP/a.pyz" "$RUNNER_TEMP/b.pyz"
          python tools/build_full.py "$out"
          python tools/build_full.py "$RUNNER_TEMP/again"
          cmp "$out"/*.zip "$RUNNER_TEMP"/again/*.zip
          cp "$RUNNER_TEMP/a.pyz" "$out/falsicore.pyz"
          cp "$RUNNER_TEMP/RELEASE_RECEIPT.json" "$out/RELEASE_RECEIPT.json"
          ( cd "$out" && sha256sum falsicore.pyz > falsicore.pyz.sha256 )
          python -I "$out/falsicore.pyz" verify-app
          python -I "$out/falsicore.pyz" self-test
          git diff --exit-code
      - name: Obtain pinned Syft SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.55.0
      - name: Generate SPDX 2.3 SBOM for the exact build assets
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.syft.outputs.cmd }}" "dir:$RUNNER_TEMP/out" -o "spdx-json@2.3=$RUNNER_TEMP/out/SBOM.spdx.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "out/SBOM.spdx.json").read_text())
          if data.get("spdxVersion") != "SPDX-2.3" or not data.get("packages"):
              raise SystemExit("Refusing empty or malformed SPDX SBOM")
          PY
      - name: Attest immutable build subjects using GitHub OIDC/Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/out/*
      - name: Bind the SPDX SBOM to the standalone executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/out/falsicore.pyz
          sbom-path: ${{ runner.temp }}/out/SBOM.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: out
      - name: Publish from tagged commit only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(printf '%s' "$tag_ref" | jq -er '.object.type')" = tag
          tag_sha="$(printf '%s' "$tag_ref" | jq -er '.object.sha')"
          tag_info="$(gh api "repos/$GH_REPO/git/tags/$tag_sha")"
          printf '%s' "$tag_info" | jq -e '.verification.verified == true and .object.type == "commit"'
          test "$(printf '%s' "$tag_info" | jq -er '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          # Build was tested and attested against this tag's exact commit.
          gh release create "$GITHUB_REF_NAME" out/* \
            --verify-tag --title "FALSICORE $GITHUB_REF_NAME" \
            --notes "Experimental offline endpoint triage. No guaranteed malware detection; see SECURITY.md and docs/AUDIT.md. Verify the external .sha256 files before running."
