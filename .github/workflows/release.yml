name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    # Tests and builds run without write access; only the publish job can write.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check tag matches source version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from falsicore import __version__
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'v'+__version__:
              raise SystemExit('Refusing release: tag and source version mismatch')
          PY
      - name: Test and audit
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SOURCE_MANIFEST.sha256
          python tools/build_release.py --check-manifest
          python -m unittest discover -s tests -q
          python tools/code_audit.py . --fail-on high
          python -m tools.evaluate_rules
      - name: Deterministic builds (twice) with external checksums
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          python tools/build_app.py "$RUNNER_TEMP/a.pyz"
          python tools/build_app.py "$RUNNER_TEMP/b.pyz"
          cmp "$RUNNER_TEMP/a.pyz" "$RUNNER_TEMP/b.pyz"
          python tools/build_full.py "$out"
          python tools/build_full.py "$RUNNER_TEMP/again"
          cmp "$out"/*.zip "$RUNNER_TEMP"/again/*.zip
          cp "$RUNNER_TEMP/a.pyz" "$out/falsicore.pyz"
          ( cd "$out" && sha256sum falsicore.pyz > falsicore.pyz.sha256 )
          python -I "$out/falsicore.pyz" verify-app
          python -I "$out/falsicore.pyz" self-test
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: out
      - name: Publish from tagged commit only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" out/* \
            --verify-tag --title "FALSICORE $GITHUB_REF_NAME" \
            --notes "Experimental offline endpoint triage. No guaranteed malware detection; see SECURITY.md and docs/AUDIT.md. Verify the external .sha256 files before running."
