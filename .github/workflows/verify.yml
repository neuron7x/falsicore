name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source manifest
        run: sha256sum -c SOURCE_MANIFEST.sha256
      - name: Unit and adversarial regression tests
        run: python -m unittest discover -s tests -q
      - name: Source audit
        run: python tools/code_audit.py . --fail-on high
      - name: Synthetic rule fixtures
        run: python -m tools.evaluate_rules
      - name: Syntax
        run: python -m compileall -q falsicore falsicore.py tools
      - name: Reproducible source builds
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_app.py "$RUNNER_TEMP/a.pyz"
          python tools/build_app.py "$RUNNER_TEMP/b.pyz"
          cmp "$RUNNER_TEMP/a.pyz" "$RUNNER_TEMP/b.pyz"
          python -I "$RUNNER_TEMP/a.pyz" verify-app
          python -I "$RUNNER_TEMP/a.pyz" self-test
          python -I "$RUNNER_TEMP/a.pyz" scan --profile quick --output-base "$RUNNER_TEMP/falsicore-runs"
          git diff --exit-code -- SOURCE_MANIFEST.sha256
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install pinned coverage measurement tool (CI only)
        run: python -m pip install --disable-pip-version-check coverage==7.13.3
      - name: Branch-aware coverage gate
        run: |
          python -m coverage run --branch --source=falsicore -m unittest discover -s tests -q
          python -m coverage report -m --fail-under=86
