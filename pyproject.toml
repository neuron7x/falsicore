[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falsicore"
version = "0.1.3"
description = "Offline Linux endpoint triage and bounded Python source-pattern audit"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
authors = [{name = "FALSICORE maintainers"}]
license = {text = "Apache-2.0"}
keywords = ["linux", "endpoint", "triage", "forensics", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
]

[project.scripts]
falsicore = "falsicore.cli:main"

[tool.setuptools]
packages = ["falsicore"]

[tool.coverage.run]
branch = true
source = ["falsicore"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[project.optional-dependencies]
# Development/CI analysis tools only; the runtime has no dependencies.
dev = ["coverage==7.16.2", "ruff==0.15.22", "bandit==1.8.6", "mypy==1.18.2", "hypothesis==6.135.26"]

[tool.bandit]
# Reviewed, deliberate patterns (see docs/AUDIT.md):
# B404/B603: the only subprocess use is the allowlisted, shell-free executor in safety.py.
# B108: /tmp, /var/tmp, /dev/shm literals are detection patterns, never written to.
# B104: "0.0.0.0" is a classification literal; nothing binds a socket.
skips = ["B404", "B603", "B108", "B104"]


[tool.mypy]
# Release gate (CI static-analysis job): zero errors on the runtime package.
python_version = "3.10"
files = ["falsicore"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
