name: verify
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # weekly unattended re-verification
  workflow_dispatch:
permissions:
  contents: read
env:
  FALSICORE_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact PR head (never a synthetic merge checkout)
        run: test "$(git rev-parse HEAD)" = "$FALSICORE_EXPECTED_HEAD_SHA"
      - name: Source manifest is current and intact
        run: |
          sha256sum -c SOURCE_MANIFEST.sha256
          python tools/build_release.py --check-manifest
      - name: Syntax
        run: python -m compileall -q falsicore falsicore.py tools
      - name: Install property-testing library (CI only; the tool stays stdlib)
        run: python -m pip install --disable-pip-version-check hypothesis==6.135.26
      - name: Unit, adversarial, lifecycle and property tests
        env:
          FALSICORE_REQUIRE_HYPOTHESIS: "1"
        run: python -m unittest discover -s tests -q
      - name: Supplementary AST pattern audit
        run: python tools/code_audit.py . --fail-on high
      - name: Synthetic rule fixtures
        run: python -m tools.evaluate_rules
      - name: Detection validity (planted artifacts vs benign twins; committed table current)
        run: python tools/validity.py --check
      - name: Reproducible builds and packaged self-test
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_app.py "$RUNNER_TEMP/a.pyz"
          python tools/build_app.py "$RUNNER_TEMP/b.pyz"
          cmp "$RUNNER_TEMP/a.pyz" "$RUNNER_TEMP/b.pyz"
          python tools/build_full.py "$RUNNER_TEMP/full-a"
          python tools/build_full.py "$RUNNER_TEMP/full-b"
          cmp "$RUNNER_TEMP"/full-a/*.zip "$RUNNER_TEMP"/full-b/*.zip
          python -I "$RUNNER_TEMP/a.pyz" verify-app
          python -I "$RUNNER_TEMP/a.pyz" self-test
          mkdir -m 700 "$RUNNER_TEMP/runs"
          python -I "$RUNNER_TEMP/a.pyz" scan --profile quick --output-base "$RUNNER_TEMP/runs"
          git diff --exit-code
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Assert exact PR head (never a synthetic merge checkout)
        run: test "$(git rev-parse HEAD)" = "$FALSICORE_EXPECTED_HEAD_SHA"
      - name: Install required evidence measurement dependencies
        run: python -m pip install --disable-pip-version-check hypothesis==6.135.26 coverage==7.13.3 ruff==0.15.22 bandit==1.8.6 mypy==1.18.2
      - name: Measure a source-bound receipt
        run: python tools/release_receipt.py --output "$RUNNER_TEMP/RELEASE_RECEIPT.json"
      - name: Independently validate recorded measurements
        run: python tools/release_receipt.py --check --output "$RUNNER_TEMP/RELEASE_RECEIPT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/RELEASE_RECEIPT.json
          if-no-files-found: error
  mutation-diff:
    # New or changed runtime lines must arrive with tests that notice when they are wrong.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Assert exact PR head (never a synthetic merge checkout)
        run: test "$(git rev-parse HEAD)" = "$FALSICORE_EXPECTED_HEAD_SHA"
      - name: Install coverage and Hypothesis (CI only)
        run: python -m pip install --disable-pip-version-check coverage==7.13.3 hypothesis==6.135.26
      - name: Record per-test coverage contexts
        run: python tools/mutate.py --coverage
      - name: Mutants on changed lines must all be killed
        run: python tools/mutate.py --diff "origin/${{ github.base_ref }}" --workers 2 --timeout 120 --json mutation-diff.json --markdown mutation-diff.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-diff-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            mutation-diff.json
            mutation-diff.md
          if-no-files-found: ignore
  static-analysis:
    # Branch protection currently requires this job, not the separate
    # evidence job. Make the required status fail whenever evidence does.
    needs: evidence
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Required evidence dependency must have succeeded
        env:
          EVIDENCE_JOB_RESULT: ${{ needs.evidence.result }}
        run: test "$EVIDENCE_JOB_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Assert exact PR head (never a synthetic merge checkout)
        run: test "$(git rev-parse HEAD)" = "$FALSICORE_EXPECTED_HEAD_SHA"
      # Exact pins (no hash lock: transitive wheels differ per platform). CI only;
      # the shipped tool has no third-party dependencies.
      - name: Install pinned analysis tools (CI only)
        run: python -m pip install --disable-pip-version-check coverage==7.13.3 ruff==0.15.22 bandit==1.8.6 mypy==1.18.2 hypothesis==6.135.26
      - name: Correctness lint (pyflakes/bugbear subset)
        run: python -m ruff check --select F,E9,B,PLE falsicore tools falsicore.py
      - name: Security analyzer
        run: python -m bandit -q -r falsicore tools falsicore.py -c pyproject.toml
      - name: Static types (zero errors on the runtime package)
        run: python -m mypy
      - name: Branch-aware coverage gate
        env:
          FALSICORE_REQUIRE_HYPOTHESIS: "1"
        run: |
          python -m coverage run --branch --source=falsicore -m unittest discover -s tests -q
          python -m coverage report -m --fail-under=88
